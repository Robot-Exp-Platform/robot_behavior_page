site_name: Robot Behavior

theme:
  logo: assets/icon.png
  favicon: assets/icon.png
  name: material
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
  icon:
    repo: fontawesome/brands/git-alt
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            指南: Guide
            总览: Overview
            安装与特性: Installation and Features
            使用驱动: Using a Driver
            实现驱动: Implementing a Driver
            概念: Concepts
            能力模型: Capability Model
            运动与控制: Motion and Control
            几何与运动学: Geometry and Kinematics
            参考: Reference
            API 映射: API Map
            生态与状态: Ecosystem and Status
  - git-authors:
      show_contribution: true
      show_line_count: true

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - attr_list
  - md_in_html
  - attr_list
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

copyright: 内部使用，切勿外传

nav:
  - 首页: index.md
  - 指南:
    - 总览: guide/overview.md
    - 安装与特性: guide/install.md
    - 使用驱动: guide/using-a-driver.md
    - 实现驱动: guide/implementing-a-driver.md
  - 概念:
    - 能力模型: concepts/capability-model.md
    - 运动与控制: concepts/motion-and-control.md
    - 几何与运动学: concepts/kinematics-and-geometry.md
  - 参考:
    - API 映射: reference/api-map.md
    - 生态与状态: reference/ecosystem.md

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css

extra:
  status:
    <identifier>: <description>
  # alternate:
  #   - name: 简体中文
  #     link: /zh/
  #     lang: zh
  #   - name: English
  #     link: /en/
  #     lang: en
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback form</a>.
